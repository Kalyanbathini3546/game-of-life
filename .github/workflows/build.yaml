name: deploy game of life
on:
  push:
    branches:
      - main
  pull_request:     
  workflow_dispatch: 

jobs:
  build_gol:
    runs-on: ubuntu-latest
 
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup jdk 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'         # You can use '8' or '1.8'
          distribution: 'temurin'  

      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: build with maven
        run: mvn clean install

      - name: deploy .war to tomcat
        run: |
          WAR_FILE=$(ls gameoflife-web/target/*.war | head -n 1)
          APP_NAME=gameoflife

          curl -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
          --upload-file "$WAR_FILE" \
          "http://${{ secrets.TOMCAT_HOST }}:8081/manager/text/deploy?path=/$APP_NAME&update=true"
